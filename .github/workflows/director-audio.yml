name: Director audio regression
on:
  pull_request:
    paths:
      - "phases/**"
      - "pipeline.py"
      - "server.py"
      - "config.py"
      - "tests/**"
      - ".github/workflows/director-audio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  director-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q config.py pipeline.py server.py phases tests
      - run: python -m unittest discover -s tests -v
